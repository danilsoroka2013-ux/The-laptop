<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>863 — Комната</title>
    <script src="js/room863.js"></script>
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; background: #000; color: #fff; font-family: 'Courier New', Courier, monospace; display: flex; flex-direction: column; justify-content: center; align-items: center; overflow: hidden; }

        h1 { font-size: 4em; letter-spacing: 10px; margin-bottom: 50px; }

        .menu-container { display: flex; flex-direction: column; gap: 20px; width: 300px; }

        button { background: transparent; border: 1px solid #fff; color: #fff; padding: 15px; cursor: pointer; font-size: 1.2em; transition: 0.3s; }
        button:hover { background: #fff; color: #000; }

        #settings-menu { display: none; text-align: center; }

        input[type=range] { width: 100%; cursor: pointer; accent-color: #fff; margin: 20px 0; }

        .label { font-size: 0.9em; letter-spacing: 2px; }
        .value { font-size: 0.9em; opacity: 0.7; }
        .hint { font-size: 0.75em; opacity: 0.6; line-height: 1.6; margin-top: 10px; }
        .hint[hidden] { display: none; }

        .footer { position: absolute; bottom: 20px; font-size: 0.8em; opacity: 0.5; }
    </style>
</head>
<body>

<div id="main-menu" class="menu-container">
    <h1>863</h1>
    <button id="continue-button" onclick="continueGame()" hidden>ПРОДОЛЖИТЬ</button>
    <button onclick="startGame()">НАЧАТЬ ИГРУ</button>
    <button onclick="showSettings()">НАСТРОЙКИ</button>
    <button onclick="exitGame()">ВЫХОД</button>
    <p id="exit-hint" class="hint" hidden>Браузер не разрешает закрыть вкладку, открытую вручную.<br>Закрой её сам или нажми Ctrl+W.</p>
</div>

<div id="settings-menu" class="menu-container">
    <h1>НАСТРОЙКИ</h1>
    <label class="label" for="volume-slider">ГРОМКОСТЬ</label>
    <input type="range" id="volume-slider" min="0" max="1" step="0.05" value="1">
    <div class="value" id="volume-value">100%</div>
    <div class="hint" id="progress-info">ПРОГРЕСС: УРОВЕНЬ 1 ИЗ 3</div>
    <button onclick="resetProgress()">СБРОСИТЬ ПРОГРЕСС</button>
    <button onclick="hideSettings()">НАЗАД</button>
</div>

<div class="footer">ИНТЕРФЕЙС БЕЗДНЫ V3.1</div>

<script>
    const mainMenu = document.getElementById('main-menu');
    const settingsMenu = document.getElementById('settings-menu');
    const continueButton = document.getElementById('continue-button');
    const exitHint = document.getElementById('exit-hint');
    const volumeSlider = document.getElementById('volume-slider');
    const volumeValue = document.getElementById('volume-value');
    const progressInfo = document.getElementById('progress-info');

    function refreshMenu() {
        const level = R863.getProgress();
        const hasProgress = level > 1;
        continueButton.hidden = !hasProgress;
        continueButton.textContent = 'ПРОДОЛЖИТЬ — УРОВЕНЬ ' + level;
        progressInfo.textContent = 'ПРОГРЕСС: УРОВЕНЬ ' + level + ' ИЗ ' + R863.MAX_LEVEL;

        const volume = R863.getVolume();
        volumeSlider.value = volume;
        volumeValue.textContent = Math.round(volume * 100) + '%';
    }

    function startGame() {
        R863.setProgress(1);
        R863.goTo(1);
    }

    function continueGame() {
        R863.goTo(R863.getProgress());
    }

    function showSettings() {
        refreshMenu();
        mainMenu.style.display = 'none';
        settingsMenu.style.display = 'flex';
    }

    function hideSettings() {
        mainMenu.style.display = 'flex';
        settingsMenu.style.display = 'none';
    }

    function resetProgress() {
        R863.resetProgress();
        refreshMenu();
    }

    function exitGame() {
        window.close();
        // Если вкладку открыли вручную, браузер её не закроет — объясняем это игроку.
        setTimeout(() => { if (!window.closed) exitHint.hidden = false; }, 400);
    }

    volumeSlider.addEventListener('input', () => {
        R863.setVolume(volumeSlider.value);
        refreshMenu();
    });

    refreshMenu();
</script>
</body>
</html>
