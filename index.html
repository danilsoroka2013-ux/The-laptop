<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>863</title>
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; background: #000; color: #fff; font-family: 'Courier New', Courier, monospace; display: flex; flex-direction: column; justify-content: center; align-items: center; overflow: hidden; }

        h1 { font-size: 4em; letter-spacing: 10px; margin-bottom: 50px; }

        .menu-container { display: flex; flex-direction: column; gap: 20px; width: 300px; }

        button { background: transparent; border: 1px solid #fff; color: #fff; padding: 15px; cursor: pointer; font-size: 1.2em; transition: 0.3s; }
        button:hover { background: #fff; color: #000; }

        #settings-menu { display: none; text-align: center; }

        input[type=range] { width: 100%; cursor: pointer; accent-color: #fff; margin: 20px 0; }

        .footer { position: absolute; bottom: 20px; font-size: 0.8em; opacity: 0.5; }
    </style>
</head>
<body>

<div id="main-menu" class="menu-container">
    <h1>863</h1>
    <button onclick="startGame()">НАЧАТЬ ИГРУ</button>
    <button onclick="showSettings()">НАСТРОЙКИ</button>
    <button onclick="window.close()">ВЫХОД</button>
</div>

<div id="settings-menu" class="menu-container">
    <h1>НАСТРОЙКИ</h1>
    <label>ГРОМКОСТЬ</label>
    <input type="range" id="volume-slider" min="0" max="1" step="0.1" value="0.5" oninput="updateVolume(this.value)">
    <button onclick="hideSettings()">НАЗАД</button>
</div>

<div class="footer">ИНТЕРФЕЙС БЕЗДНЫ V3.0</div>

<script>
    const mainMenu = document.getElementById('main-menu');
    const settingsMenu = document.getElementById('settings-menu');

    function startGame() {
        // ИСПРАВЛЕНО: теперь ведет на первый уровень
        window.location.href = 'one.html';
    }

    function showSettings() {
        mainMenu.style.display = 'none';
        settingsMenu.style.display = 'flex';
    }

    function hideSettings() {
        mainMenu.style.display = 'flex';
        settingsMenu.style.display = 'none';
    }

    function updateVolume(val) {
        console.log("Громкость: " + val);
    }
</script>
</body>
</html>
