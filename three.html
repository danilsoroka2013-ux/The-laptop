<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Комната 863 — Уровень 3: Серверная (Финал)</title>

    <!-- Локальная копия three.js r128 (MIT, см. vendor/three.LICENSE.txt) — игра работает без интернета -->
    <script src="js/room863.js"></script>
    <script src="js/touch.js"></script>
    <script src="vendor/three.min.js"></script>
    <script>R863.ensureThree();</script>

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            user-select:none;
        }

        html,body{
            width:100%;
            height:100%;
            overflow:hidden;
            background:#000;
            font-family:sans-serif;
        }

        #gameContainer{
            position:relative;
            width:100vw;
            height:100vh;
        }

        canvas{
            display:block;
        }

        #clickToStart{
            position:absolute;
            inset:0;
            background:rgba(0,0,0,0.97);
            color:#ff3333;
            display:flex;
            flex-direction:column;
            justify-content:center;
            align-items:center;
            z-index:100;
            cursor:pointer;
            text-align:center;
        }

        #crosshair{
            position:absolute;
            top:50%;
            left:50%;
            width:16px;
            height:16px;
            transform:translate(-50%,-50%);
            z-index:5;
            pointer-events:none;
        }

        #crosshair::before,
        #crosshair::after{
            content:'';
            position:absolute;
            background:white;
        }

        #crosshair::before{
            width:24px;
            height:2px;
            top:7px;
            left:-4px;
        }

        #crosshair::after{
            width:2px;
            height:24px;
            left:7px;
            top:-4px;
        }

        #taskCounter{
            position:absolute;
            top:20px;
            left:20px;
            background:rgba(0,0,0,0.75);
            color:#ff3333;
            border:1px solid #330000;
            padding:10px;
            z-index:10;
        }

        #subtitles{
            position:absolute;
            top:5%;
            left:50%;
            transform:translateX(-50%);
            background:rgba(0,0,0,0.8);
            color:white;
            padding:12px 24px;
            border-radius:4px;
            opacity:0;
            transition:0.3s;
            z-index:10;
        }

        #interactionPrompt{
            position:absolute;
            bottom:15%;
            left:50%;
            transform:translateX(-50%);
            background:rgba(0,0,0,0.85);
            border:1px solid #ff3333;
            color:white;
            padding:12px 24px;
            display:none;
            z-index:10;
        }

        #screamer{
            position:absolute;
            inset:0;
            background:black url('image/face.jpg') center/contain no-repeat;
            z-index:999;
            display:none;
        }

        #windOverlay{
            position:absolute;
            inset:0;
            background:radial-gradient(circle, rgba(255,255,255,0.15), transparent 70%);
            pointer-events:none;
            opacity:0;
            transition:0.2s;
            z-index:6;
        }

    </style>
</head>
<body>

<div id="gameContainer">

    <div id="windOverlay"></div>

    <div id="clickToStart">
        <h1>УРОВЕНЬ 3 — СЕРВЕРНАЯ</h1>

        <p style="margin-top:20px;color:#aaa;">
            Отключи генераторы и доберись до выхода.
        </p>

        <p style="margin-top:40px;color:#666;">
            КЛИК ДЛЯ СТАРТА
        </p>

        <a href="index.html" onclick="event.stopPropagation()" style="margin-top:44px; font-size: 13px; color: #777; text-decoration: none; border-bottom: 1px solid #333;">← В главное меню</a>
    </div>

    <div id="crosshair"></div>

    <div id="taskCounter">
        Генераторы: 0 / 0
    </div>

    <div id="interactionPrompt">
        Нажмите [ E ]
    </div>

    <div id="subtitles"></div>

    <div id="screamer"></div>

</div>

<script>

    //////////////////////////////////////////////////////
    // HTML
    //////////////////////////////////////////////////////

    const startScreen = document.getElementById('clickToStart');
    const taskCounterEl = document.getElementById('taskCounter');
    const subtitles = document.getElementById('subtitles');
    const screamerEl = document.getElementById('screamer');
    const windOverlay = document.getElementById('windOverlay');

    //////////////////////////////////////////////////////
    // GAME
    //////////////////////////////////////////////////////

    const game = {

        state:'start',

        generatorsDeactivated:0,

        totalGenerators:0,

        monsterSpeed:0.04,

        isSprinting:false,

        audioInitialized:false
    };

    //////////////////////////////////////////////////////
    // AUDIO
    //////////////////////////////////////////////////////

    const sounds = {

        fon:new Audio('music/fon.mp3'),

        scream:new Audio('music/scream.mp3'),

        knock:new Audio('music/knock.mp3')
    };

    sounds.fon.loop = true;
    R863.applyVolume(sounds.fon, 0.45);
    R863.applyVolume(sounds.scream, 1);
    R863.applyVolume(sounds.knock, 1);

    function playSound(name){

        if(!sounds[name]) return;

        sounds[name].currentTime = 0;

        sounds[name].play().catch(()=>{});
    }

    //////////////////////////////////////////////////////
    // SCENE
    //////////////////////////////////////////////////////

    const scene = new THREE.Scene();

    scene.fog = new THREE.FogExp2(
        0x050505,
        0.06
    );

    //////////////////////////////////////////////////////
    // CAMERA
    //////////////////////////////////////////////////////

    const camera = new THREE.PerspectiveCamera(
        75,
        window.innerWidth / window.innerHeight,
        0.1,
        1000
    );

    const cameraPivot = new THREE.Object3D();

    cameraPivot.position.set(0,1.6,8);

    cameraPivot.add(camera);

    scene.add(cameraPivot);

    //////////////////////////////////////////////////////
    // RENDERER
    //////////////////////////////////////////////////////

    const renderer = new THREE.WebGLRenderer({
        antialias:true
    });

    renderer.setSize(
        window.innerWidth,
        window.innerHeight
    );

    renderer.shadowMap.enabled = true;

    document.getElementById('gameContainer')
    .appendChild(renderer.domElement);

    //////////////////////////////////////////////////////
    // LIGHT
    //////////////////////////////////////////////////////

    scene.add(
        new THREE.AmbientLight(0xffffff,0.03)
    );

    const redLight = new THREE.PointLight(
        0xff0000,
        2,
        20
    );

    redLight.position.set(0,2,-3);

    scene.add(redLight);

    const flashlight = new THREE.SpotLight(
        0xfff0dd,
        4,
        15,
        Math.PI / 4,
        0.4
    );

    flashlight.position.set(0,0,0);

    const flashTarget = new THREE.Object3D();

    flashTarget.position.set(0,0,-1);

    camera.add(flashTarget);

    flashlight.target = flashTarget;

    cameraPivot.add(flashlight);

    //////////////////////////////////////////////////////
    // MATERIALS
    //////////////////////////////////////////////////////

    const wallMat = new THREE.MeshStandardMaterial({
        color:0x1b1b1b,
        roughness:0.9
    });

    const floorMat = new THREE.MeshStandardMaterial({
        color:0x101010
    });

    const metalMat = new THREE.MeshStandardMaterial({
        color:0x333333,
        metalness:0.7,
        roughness:0.4
    });

    const genActiveMat = new THREE.MeshStandardMaterial({
        color:0x00ff33,
        emissive:0x00ff33,
        emissiveIntensity:0.8
    });

    const genDeadMat = new THREE.MeshStandardMaterial({
        color:0x330000
    });

    //////////////////////////////////////////////////////
    // CREATE BOX
    //////////////////////////////////////////////////////

    function createBox(w,h,d,x,y,z,mat=wallMat){

        const mesh = new THREE.Mesh(

            new THREE.BoxGeometry(w,h,d),

            mat
        );

        mesh.position.set(x,y,z);

        mesh.castShadow = true;

        mesh.receiveShadow = true;

        scene.add(mesh);

        return mesh;
    }

    //////////////////////////////////////////////////////
    // MAP
    //////////////////////////////////////////////////////

    createBox(22,0.1,22,0,0,0,floorMat);

    //////////////////////////////////////////////////////
    // WALLS
    //////////////////////////////////////////////////////

    // ЗАДНЯЯ СТЕНА
    createBox(22,3,0.2,0,1.5,11);

    // БОКОВЫЕ
    createBox(0.2,3,22,-11,1.5,0);
    createBox(0.2,3,22,11,1.5,0);

    //////////////////////////////////////////////////////
    // ПЕРЕДНЯЯ СТЕНА С ПРОХОДОМ
    //////////////////////////////////////////////////////

    createBox(8,3,0.2,-7,1.5,-11);

    createBox(8,3,0.2,7,1.5,-11);

    //////////////////////////////////////////////////////
    // LABYRINTH
    //////////////////////////////////////////////////////

    const labyrinth = [

        createBox(6,3,1,-4,1.5,-4),

        createBox(6,3,1,4,1.5,-4),

        createBox(1,3,6,-5,1.5,2),

        createBox(1,3,6,5,1.5,0),

        createBox(8,3,1,0,1.5,5)

    ];

    //////////////////////////////////////////////////////
    // EXIT CORRIDOR
    //////////////////////////////////////////////////////

    const exitCorridor = new THREE.Mesh(

        new THREE.BoxGeometry(4,2.5,8),

        new THREE.MeshStandardMaterial({

            color:0xffffff,

            emissive:0xffffff,

            emissiveIntensity:2
        })
    );

    exitCorridor.position.set(0,1,-14);

    exitCorridor.visible = false;

    scene.add(exitCorridor);

    //////////////////////////////////////////////////////
    // EXIT LIGHT
    //////////////////////////////////////////////////////

    const exitLight = new THREE.PointLight(
        0xffffff,
        10,
        30
    );

    exitLight.position.set(0,1.5,-14);

    exitLight.visible = false;

    scene.add(exitLight);

    //////////////////////////////////////////////////////
    // GENERATORS
    //////////////////////////////////////////////////////

    const spawnPoints = [

        {x:-9,z:-9},

        {x:9,z:-9},

        {x:8,z:5},

        {x:-8,z:5},

        {x:0,z:-6}
    ];

    game.totalGenerators =
    Math.floor(Math.random()*3)+3;

    const generators = [];

    for(let i=0;i<game.totalGenerators;i++){

        const p = spawnPoints[i];

        const gen = createBox(
            1.2,
            2.2,
            1.2,
            p.x,
            1.1,
            p.z,
            genActiveMat
        );

        generators.push({
            mesh:gen,
            active:true
        });
    }

    taskCounterEl.innerText =
    `Генераторы: 0 / ${game.totalGenerators}`;

    //////////////////////////////////////////////////////
    // MONSTER
    //////////////////////////////////////////////////////

    const faceTex = new THREE.TextureLoader()
    .load('image/face.jpg');

    const monster = new THREE.Group();

    monster.position.set(0,1.3,-6);

    scene.add(monster);

    const base = new THREE.Mesh(
        new THREE.BoxGeometry(0.9,0.04,0.6),
        metalMat
    );

    base.position.y = -0.2;

    const lid = new THREE.Mesh(
        new THREE.BoxGeometry(0.9,0.6,0.03),
        metalMat
    );

    const screen = new THREE.Mesh(
        new THREE.PlaneGeometry(0.84,0.54),

        new THREE.MeshBasicMaterial({
            map:faceTex
        })
    );

    screen.position.z = 0.02;

    monster.add(base);
    monster.add(lid);
    monster.add(screen);

    //////////////////////////////////////////////////////
    // CONTROLS
    //////////////////////////////////////////////////////

    const controls = {

        forward:false,

        backward:false,

        left:false,

        right:false
    };

    //////////////////////////////////////////////////////
    // POINTER LOCK
    //////////////////////////////////////////////////////

    startScreen.addEventListener('click',()=>{

        // На телефонах и планшетах pointer lock недоступен — игру запускает js/touch.js
        if(R863.isTouchDevice()) return;

        renderer.domElement.requestPointerLock();
    });

    document.addEventListener('pointerlockchange',()=>{

        if(document.pointerLockElement === renderer.domElement){

            startScreen.style.display = 'none';

            game.state = 'playing';

            if(!game.audioInitialized){

                playSound('fon');

                game.audioInitialized = true;
            }

        }else{

            if(game.state !== 'dead'){

                startScreen.style.display = 'flex';
            }
        }
    });

    //////////////////////////////////////////////////////
    // KEYBOARD
    //////////////////////////////////////////////////////

    window.addEventListener('keydown',e=>{

        if(game.state !== 'playing') return;

        if(e.code === 'KeyW') controls.forward = true;
        if(e.code === 'KeyS') controls.backward = true;
        if(e.code === 'KeyA') controls.left = true;
        if(e.code === 'KeyD') controls.right = true;

        if(e.code === 'ShiftLeft'){

            game.isSprinting = true;

            windOverlay.style.opacity = '1';
        }

        if(e.code === 'KeyE'){

            handleInteraction();
        }
    });

    window.addEventListener('keyup',e=>{

        if(e.code === 'KeyW') controls.forward = false;
        if(e.code === 'KeyS') controls.backward = false;
        if(e.code === 'KeyA') controls.left = false;
        if(e.code === 'KeyD') controls.right = false;

        if(e.code === 'ShiftLeft'){

            game.isSprinting = false;

            windOverlay.style.opacity = '0';
        }
    });

    //////////////////////////////////////////////////////
    // MOUSE
    //////////////////////////////////////////////////////

    document.addEventListener('mousemove',e=>{

        if(document.pointerLockElement !== renderer.domElement)
        return;

        cameraPivot.rotation.y -= e.movementX * 0.0025;

        camera.rotation.x -= e.movementY * 0.0025;

        camera.rotation.x = Math.max(
            -1.5,
            Math.min(1.5,camera.rotation.x)
        );
    });

    //////////////////////////////////////////////////////
    // COLLISION
    //////////////////////////////////////////////////////

    function checkCollision(pos,radius=0.4){

        if(
            pos.x < -10.4 + radius ||
            pos.x > 10.4 - radius ||
            pos.z < -15 + radius ||
            pos.z > 10.4 - radius
        ){
            return true;
        }

        for(let wall of labyrinth){

            const box = new THREE.Box3()
            .setFromObject(wall);

            box.min.x -= radius;
            box.max.x += radius;

            box.min.z -= radius;
            box.max.z += radius;

            if(
                box.containsPoint(
                    new THREE.Vector3(
                        pos.x,
                        1.5,
                        pos.z
                    )
                )
            ){
                return true;
            }
        }

        return false;
    }

    //////////////////////////////////////////////////////
    // INTERACTION
    //////////////////////////////////////////////////////

    const raycaster = new THREE.Raycaster();

    function handleInteraction(){

        raycaster.setFromCamera(
            new THREE.Vector2(0,0),
            camera
        );

        for(let gen of generators){

            if(!gen.active) continue;

            const dist =
            cameraPivot.position.distanceTo(
                gen.mesh.position
            );

            if(dist < 3){

                const hit =
                raycaster.intersectObject(gen.mesh);

                if(hit.length > 0){

                    gen.active = false;

                    gen.mesh.material = genDeadMat;

                    game.generatorsDeactivated++;

                    playSound('knock');

                    taskCounterEl.innerText =
                    `Генераторы: ${game.generatorsDeactivated} / ${game.totalGenerators}`;

                    if(
                        game.generatorsDeactivated
                        ===
                        game.totalGenerators
                    ){

                        exitCorridor.visible = true;

                        exitLight.visible = true;

                        subtitles.innerText =
                        'ПУТЬ ОТКРЫТ. БЕГИ К СВЕТУ.';

                        subtitles.style.opacity = 1;
                    }
                }
            }
        }
    }

    //////////////////////////////////////////////////////
    // UPDATE
    //////////////////////////////////////////////////////

    const monsterRaycaster =
    new THREE.Raycaster();

    function updateGame(){

        if(game.state !== 'playing') return;

        //////////////////////////////////////////////////
        // PLAYER
        //////////////////////////////////////////////////

        const dir = new THREE.Vector3();

        camera.getWorldDirection(dir);

        dir.y = 0;

        dir.normalize();

        const sideDir =
        new THREE.Vector3(-dir.z,0,dir.x);

        const move = new THREE.Vector3();

        if(controls.forward) move.add(dir);
        if(controls.backward) move.sub(dir);

        if(controls.left) move.sub(sideDir);
        if(controls.right) move.add(sideDir);

        move.normalize();

        move.multiplyScalar(
            game.isSprinting ? 0.12 : 0.06
        );

        const nextPos =
        cameraPivot.position.clone().add(move);

        if(!checkCollision(nextPos,0.4)){

            cameraPivot.position.copy(nextPos);
        }

        //////////////////////////////////////////////////
        // MONSTER AI
        //////////////////////////////////////////////////

        const playerPos = cameraPivot.position;

        const toPlayer =
        playerPos.clone().sub(monster.position);

        const distance =
        toPlayer.length();

        toPlayer.normalize();

        monsterRaycaster.set(
            monster.position,
            toPlayer
        );

        const intersects =
        monsterRaycaster.intersectObjects(
            labyrinth,
            false
        );

        const seesPlayer =

            intersects.length === 0 ||

            intersects[0].distance > distance;

        if(seesPlayer){

            const moveDir = toPlayer.clone();

            const nextM =
            monster.position.clone().add(

                moveDir.clone()
                .multiplyScalar(game.monsterSpeed)
            );

            if(!checkCollision(nextM,0.6)){

                monster.position.copy(nextM);

            }else{

                const slideX =
                monster.position.clone();

                slideX.x +=
                moveDir.x * game.monsterSpeed;

                const slideZ =
                monster.position.clone();

                slideZ.z +=
                moveDir.z * game.monsterSpeed;

                if(!checkCollision(slideX,0.6)){

                    monster.position.copy(slideX);
                }

                if(!checkCollision(slideZ,0.6)){

                    monster.position.copy(slideZ);
                }
            }

            //////////////////////////////////////////////////
            // SMOOTH ROTATION
            //////////////////////////////////////////////////

            const targetAngle = Math.atan2(

                playerPos.x - monster.position.x,

                playerPos.z - monster.position.z
            );

            monster.rotation.y +=
            (targetAngle - monster.rotation.y)
            * 0.08;
        }

        //////////////////////////////////////////////////
        // DEATH
        //////////////////////////////////////////////////

        if(distance < 1.1){

            game.state = 'dead';

            playSound('scream');

            screamerEl.style.display = 'block';

            setTimeout(()=>{

                location.reload();

            },2000);
        }

        //////////////////////////////////////////////////
        // WIN
        //////////////////////////////////////////////////

        if(
            game.generatorsDeactivated
            ===
            game.totalGenerators
        ){

            if(
                playerPos.distanceTo(
                    exitCorridor.position
                ) < 3
            ){

                subtitles.innerText =
                'ТЫ ВЫБРАЛСЯ';

                subtitles.style.opacity = 1;

                setTimeout(()=>{

                    location.href = 'index.html';

                },2000);
            }
        }
    }

    //////////////////////////////////////////////////////
    // LOOP
    //////////////////////////////////////////////////////

    function animate(){

        requestAnimationFrame(animate);

        updateGame();

        renderer.render(scene,camera);
    }

    //////////////////////////////////////////////////////
    // МОСТ ДЛЯ СЕНСОРНОГО УПРАВЛЕНИЯ (js/touch.js)
    //////////////////////////////////////////////////////

    window.R863Input = {

        begin:function(){

            if(game.state !== 'start') return;

            startScreen.style.display = 'none';

            game.state = 'playing';

            if(!game.audioInitialized){

                playSound('fon');

                game.audioInitialized = true;
            }

            subtitles.innerText =
            'Отключи генераторы и доберись до выхода.';

            subtitles.style.opacity = 1;
        },

        move:function(forward,backward,left,right){

            controls.forward = forward;
            controls.backward = backward;
            controls.left = left;
            controls.right = right;
        },

        look:function(dx,dy){

            if(game.state !== 'playing') return;

            cameraPivot.rotation.y -= dx * 0.0025;

            camera.rotation.x -= dy * 0.0025;

            camera.rotation.x = Math.max(-1.5,Math.min(1.5,camera.rotation.x));
        },

        interact:function(){

            if(game.state === 'playing') handleInteraction();
        },

        setSprint:function(on){

            if(game.isSprinting === on) return;

            game.isSprinting = on;

            windOverlay.style.opacity = on ? '1' : '0';
        }
    };

    R863.setProgress(3);

    animate();

    //////////////////////////////////////////////////////
    // RESIZE
    //////////////////////////////////////////////////////

    window.addEventListener('resize',()=>{

        camera.aspect =
        window.innerWidth /
        window.innerHeight;

        camera.updateProjectionMatrix();

        renderer.setSize(
            window.innerWidth,
            window.innerHeight
        );
    });

</script>

</body>
</html>
