<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Комната 863 — Часть 1 (Фикс Фонарика и Выхода)</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
        body, html { width: 100%; height: 100%; overflow: hidden; background-color: #000; font-family: sans-serif; }
        #gameContainer { position: relative; width: 100vw; height: 100vh; }
        canvas { display: block; width: 100%; height: 100%; }

        #crosshair {
            position: absolute; top: 50%; left: 50%; width: 16px; height: 16px;
            transform: translate(-50%, -50%); pointer-events: none; z-index: 2;
        }
        #crosshair::before, #crosshair::after { content: ''; position: absolute; background: rgba(255, 255, 255, 0.8); }
        #crosshair::before { top: 7px; left: -4px; width: 24px; height: 2px; }
        #crosshair::after { top: -4px; left: 7px; width: 2px; height: 24px; }

        #interactionPrompt {
            position: absolute; bottom: 15%; left: 50%; transform: translateX(-50%);
            color: #fff; background: rgba(0, 0, 0, 0.85); padding: 12px 24px;
            border-radius: 4px; border: 1px solid #ffcc00; font-size: 18px;
            display: none; pointer-events: none; text-align: center; z-index: 3;
        }
        #clickToStart {
            position: absolute; width: 100%; height: 100%; background: rgba(5,5,5,0.98);
            color: #fff; display: flex; flex-direction: column; justify-content: center;
            align-items: center; font-size: 20px; cursor: pointer; text-align: center; z-index: 20;
        }
        #laptopScreen {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            width: 400px; height: 300px; background: #021202; border: 6px solid #333;
            border-radius: 4px; color: #00ff00; padding: 30px; display: flex;
            flex-direction: column; justify-content: center; align-items: center;
            box-shadow: 0 0 40px rgba(0,255,0,0.3); display: none; z-index: 10; font-family: monospace;
        }
        #laptopScreen input {
            background: #000; border: 1px solid #00ff00; color: #00ff00;
            padding: 10px; font-size: 24px; text-align: center; outline: none;
            width: 150px; margin: 20px 0; letter-spacing: 6px;
        }
        #laptopScreen button { background: #00ff00; color: #000; border: none; padding: 10px 24px; font-size: 14px; cursor: pointer; font-weight: bold; }
        #subtitles {
            position: absolute; top: 5%; left: 50%; transform: translateX(-50%);
            color: #fff; background: rgba(0, 0, 0, 0.8); padding: 12px 24px;
            border-radius: 4px; font-size: 16px; text-align: center; max-width: 80%;
            pointer-events: none; transition: opacity 0.3s; opacity: 0; z-index: 5;
        }
    </style>
</head>
<body>

<div id="gameContainer">
    <div id="clickToStart">
        <h2>КОМНАТА 863 — ЭТАП 1</h2>
        <p style="margin-top: 15px; font-size: 16px; color: #ccc;">Кликни по экрану, чтобы начать</p>
        <p style="margin-top: 30px; font-size: 14px; color: #555;">WASD — Движение | Мышь — Обзор | E — Действие</p>
    </div>

    <div id="crosshair"></div>
    <div id="interactionPrompt">Нажмите [ E ]</div>

    <div id="laptopScreen">
        <h3>ТРЕБУЕТСЯ КОД ДОСТУПА</h3>
        <input type="text" id="passwordInput" maxlength="3" placeholder="***" autocomplete="off">
        <button id="submitPassword">ПОДТВЕРДИТЬ</button>
        <p id="loginError" style="color: #ff3333; margin-top: 15px; display: none;">ДОСТУП ЗАПРЕЩЕН</p>
    </div>

    <div id="subtitles"></div>
</div>

<script>
    // --- ЗВУКОВОЙ ДВИЖОК ---
    const soundFon = new Audio('music/fon.mp3'); soundFon.loop = true; soundFon.volume = 0.2;
    const soundKnock = new Audio('music/knock.mp3');
    const soundDoor = new Audio('music/door.mp3');
    let audioStarted = false;

    const startScreen = document.getElementById('clickToStart');
    const promptEl = document.getElementById('interactionPrompt');
    const laptopScreen = document.getElementById('laptopScreen');
    const passwordInput = document.getElementById('passwordInput');
    const submitPassword = document.getElementById('submitPassword');
    const loginError = document.getElementById('loginError');
    const subtitles = document.getElementById('subtitles');

    const game = {
        state: 'start',
        doorOpened: false,
        doorAngle: 0,
        flashlightSpawned: false,
        hasFlashlight: false,
        correctCode: Math.floor(100 + Math.random() * 900).toString(),
        lookingAt: null
    };

    // 1. Сцена
    const scene = new THREE.Scene();
    scene.fog = new THREE.FogExp2(0x030303, 0.06);

    const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
    const cameraPivot = new THREE.Object3D();
    cameraPivot.add(camera);
    scene.add(cameraPivot);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    document.getElementById('gameContainer').appendChild(renderer.domElement);

    // 2. Свет
    const ambientLight = new THREE.AmbientLight(0xffffff, 0.12);
    scene.add(ambientLight);

    const corridorLight = new THREE.PointLight(0xffddaa, 0.9, 8);
    corridorLight.position.set(0, 2.5, -2);
    corridorLight.castShadow = true;
    scene.add(corridorLight);

    const tableLight = new THREE.PointLight(0xddf0ff, 0.3, 6);
    tableLight.position.set(0, 2.8, -11);
    tableLight.castShadow = true;
    scene.add(tableLight);

    const flashlight = new THREE.SpotLight(0xffffff, 0, 15, Math.PI / 5, 0.4, 1);
    flashlight.castShadow = true;
    scene.add(flashlight);
    scene.add(flashlight.target);

    // 3. Материалы
    const wallMat = new THREE.MeshStandardMaterial({ color: 0x444444, roughness: 0.9 });
    const floorMat = new THREE.MeshStandardMaterial({ color: 0x181818, roughness: 0.9 });
    const doorMat = new THREE.MeshStandardMaterial({ color: 0x3d2516, roughness: 0.6 });
    const tableMat = new THREE.MeshStandardMaterial({ color: 0x2b1d11, roughness: 0.8 });
    const metalMat = new THREE.MeshStandardMaterial({ color: 0x222222, metalness: 0.8, roughness: 0.3 });

    function createWall(w, h, d, x, y, z) {
        const mesh = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), wallMat);
        mesh.position.set(x, y, z); mesh.receiveShadow = true; mesh.castShadow = true;
        scene.add(mesh);
    }

    // 4. Стены уровня
    createWall(20, 0.1, 20, 0, 0, -6);
    createWall(20, 0.1, 20, 0, 3, -6);

    createWall(0.2, 3, 6, -1.5, 1.5, -3);
    createWall(0.2, 3, 6, 1.5, 1.5, -3);
    createWall(3, 3, 0.2, 0, 1.5, 0);

    createWall(4, 3, 0.2, -3.5, 1.5, -6);
    createWall(4, 3, 0.2, 3.5, 1.5, -6);
    createWall(3.0, 0.7, 0.2, 0, 2.65, -6);

    createWall(0.2, 3, 10, -5, 1.5, -11);
    createWall(0.2, 3, 10, 5, 1.5, -11);
    createWall(10, 3, 0.2, 0, 1.5, -16);

    // 5. Дверь и Табличка
    const doorPivot = new THREE.Object3D();
    doorPivot.position.set(-1.5, 0, -6);
    scene.add(doorPivot);

    const doorMesh = new THREE.Mesh(new THREE.BoxGeometry(3.0, 2.3, 0.1), doorMat);
    doorMesh.position.set(1.5, 1.15, 0);
    doorMesh.castShadow = true;
    doorPivot.add(doorMesh);

    const canvasDoorSign = document.createElement('canvas');
    canvasDoorSign.width = 128; canvasDoorSign.height = 64;
    const dsCtx = canvasDoorSign.getContext('2d');
    dsCtx.fillStyle = '#222'; dsCtx.fillRect(0,0,128,64);
    dsCtx.strokeStyle = '#fff'; dsCtx.lineWidth = 4; dsCtx.strokeRect(4,4,120,56);
    dsCtx.fillStyle = '#fff'; dsCtx.font = 'bold 28px sans-serif'; dsCtx.textAlign = 'center';
    dsCtx.fillText("863", 64, 42);

    const doorSignTex = new THREE.CanvasTexture(canvasDoorSign);
    const doorSign = new THREE.Mesh(new THREE.PlaneGeometry(0.4, 0.2), new THREE.MeshBasicMaterial({map: doorSignTex}));
    doorSign.position.set(1.5, 1.5, 0.06);
    doorPivot.add(doorSign);

    // 6. Мебель
    const tableGroup = new THREE.Group();
    const tabletop = new THREE.Mesh(new THREE.BoxGeometry(1.8, 0.08, 1), tableMat);
    tabletop.position.y = 0.9; tabletop.castShadow = true; tabletop.receiveShadow = true;
    tableGroup.add(tabletop);
    for(let zOffset of [-0.4, 0.4]) {
        for(let xOffset of [-0.8, 0.8]) {
            const leg = new THREE.Mesh(new THREE.BoxGeometry(0.08, 0.9, 0.08), tableMat);
            leg.position.set(xOffset, 0.45, zOffset); leg.castShadow = true;
            tableGroup.add(leg);
        }
    }
    tableGroup.position.set(0, 0, -11);
    scene.add(tableGroup);

    // Ноутбук
    const laptopGroup = new THREE.Group();
    const laptopBase = new THREE.Mesh(new THREE.BoxGeometry(0.45, 0.03, 0.3), metalMat);
    laptopBase.position.y = 0.955; laptopBase.castShadow = true;
    laptopGroup.add(laptopBase);

    const laptopLidGroup = new THREE.Group();
    laptopLidGroup.position.set(0, 0.96, -0.14);
    const laptopLid = new THREE.Mesh(new THREE.BoxGeometry(0.45, 0.3, 0.02), metalMat);
    laptopLid.position.y = 0.15; laptopLid.castShadow = true;
    const laptopDisplay = new THREE.Mesh(new THREE.PlaneGeometry(0.42, 0.26), new THREE.MeshBasicMaterial({color: 0x002200}));
    laptopDisplay.position.set(0, 0.15, 0.011);
    laptopLidGroup.add(laptopLid, laptopDisplay);
    laptopLidGroup.rotation.x = -0.4;
    laptopGroup.add(laptopLidGroup);
    laptopGroup.position.set(0, 0, -11);
    scene.add(laptopGroup);

    // ФОНАРИК (Опущен ровно на стол — 0.94)
    const flashlightGroup = new THREE.Group();
    const fBody = new THREE.Mesh(new THREE.CylinderGeometry(0.025, 0.025, 0.18, 16), metalMat);
    fBody.rotation.x = Math.PI / 2; fBody.castShadow = true;
    const fHead = new THREE.Mesh(new THREE.CylinderGeometry(0.04, 0.025, 0.05, 16), metalMat);
    fHead.position.z = 0.1; fHead.rotation.x = Math.PI / 2; fHead.castShadow = true;
    flashlightGroup.add(fBody, fHead);
    flashlightGroup.position.set(0.5, 0.98, -11);
    flashlightGroup.visible = false;
    scene.add(flashlightGroup);

    // 7. Записка
    const canvasNote = document.createElement('canvas');
    canvasNote.width = 256; canvasNote.height = 256;
    const nCtx = canvasNote.getContext('2d');
    nCtx.fillStyle = '#e2e2e2'; nCtx.fillRect(0, 0, 256, 256);
    nCtx.fillStyle = '#cc1111'; nCtx.font = 'bold 85px monospace'; nCtx.textAlign = 'center';
    nCtx.fillText(game.correctCode, 128, 150);

    const noteTex = new THREE.CanvasTexture(canvasNote);
    const noteMesh = new THREE.Mesh(new THREE.PlaneGeometry(0.4, 0.4), new THREE.MeshStandardMaterial({map: noteTex, roughness: 1}));
    noteMesh.position.set(4.88, 1.4, -12);
    noteMesh.rotation.y = -Math.PI / 2;
    noteMesh.visible = false;
    scene.add(noteMesh);

    // 8. Управление
    cameraPivot.position.set(0, 1.6, -1.5);
    let moveControls = { forward: false, backward: false, left: false, right: false };
    let lon = 0, lat = 0;

    startScreen.addEventListener('click', () => {
        renderer.domElement.requestPointerLock();
        // Запуск музыки при первом клике
        if(!audioStarted){ soundFon.play(); audioStarted = true; }
    });
    document.addEventListener('pointerlockchange', () => {
        if (document.pointerLockElement === renderer.domElement) {
            startScreen.style.display = 'none';
            if (game.state === 'start') { game.state = 'playing'; showSubtitle("Дверь заперта. Подойди к ней вплотную и нажми [ E ]"); }
            if (game.state === 'laptop_ui') game.state = 'playing';
        } else if (game.state !== 'laptop_ui' && game.state !== 'win') {
            startScreen.style.display = 'flex';
        }
    });

    document.addEventListener('mousemove', (e) => {
        if (document.pointerLockElement !== renderer.domElement || game.state !== 'playing') return;
        lon -= e.movementX * 0.0025;
        lat -= e.movementY * 0.0025;
        lat = Math.max(-Math.PI / 2.2, Math.min(Math.PI / 2.2, lat));
        cameraPivot.rotation.y = lon;
        camera.rotation.x = lat;
    });

    window.addEventListener('keydown', e => {
        if (e.code === 'KeyE' && game.state === 'laptop_ui') {
            closeLaptopUI();
            return;
        }

        if(e.code === 'KeyW') moveControls.forward = true;
        if(e.code === 'KeyS') moveControls.backward = true;
        if(e.code === 'KeyA') moveControls.left = true;
        if(e.code === 'KeyD') moveControls.right = true;
        if(e.code === 'KeyE' && game.state === 'playing') handleInteraction();
    });
    window.addEventListener('keyup', e => {
        if(e.code === 'KeyW') moveControls.forward = false;
        if(e.code === 'KeyS') moveControls.backward = false;
        if(e.code === 'KeyA') moveControls.left = false;
        if(e.code === 'KeyD') moveControls.right = false;
    });

    function showSubtitle(text) {
        subtitles.innerText = text; subtitles.style.opacity = 1;
        setTimeout(() => { if (subtitles.innerText === text) subtitles.style.opacity = 0; }, 4000);
    }

    // 9. Логика луча (Raycasting)
    const raycaster = new THREE.Raycaster();
    const centerMouse = new THREE.Vector2(0, 0);

    function checkInteractions() {
        raycaster.setFromCamera(centerMouse, camera);
        game.lookingAt = null;
        promptEl.style.display = 'none';

        if (!game.doorOpened && cameraPivot.position.distanceTo(new THREE.Vector3(0, 1.6, -6)) < 2.5) {
            if (raycaster.intersectObject(doorMesh).length > 0) {
                game.lookingAt = 'door'; promptEl.innerText = "Открыть дверь на [ E ]"; promptEl.style.display = 'block'; return;
            }
        }
        if (cameraPivot.position.distanceTo(tableGroup.position) < 2.2) {
            if (raycaster.intersectObject(laptopBase).length > 0) {
                game.lookingAt = 'laptop';
                promptEl.innerText = "Активировать ноутбук [ E ]"; promptEl.style.display = 'block'; return;
            }
            if (game.flashlightSpawned && !game.hasFlashlight) {
                if (raycaster.intersectObject(fBody).length > 0 || raycaster.intersectObject(fHead).length > 0) {
                    game.lookingAt = 'flashlight'; promptEl.innerText = "Подобрать ФОНАРИК [ E ]"; promptEl.style.display = 'block';
                }
            }
        }
    }

    function handleInteraction() {
        if (game.lookingAt === 'door') {
            game.doorOpened = true;
            soundDoor.currentTime = 0; soundDoor.play();
            showSubtitle("Дверь открыта. Заходи внутрь и активируй ноутбук на столе.");
        }
        else if (game.lookingAt === 'laptop') {
            document.exitPointerLock(); game.state = 'laptop_ui';
            soundKnock.currentTime = 0; soundKnock.play();
            laptopScreen.style.display = 'flex'; passwordInput.focus();
        }
        else if (game.lookingAt === 'flashlight') {
            game.hasFlashlight = true;
            flashlightGroup.visible = false;
            noteMesh.visible = true;
            soundKnock.currentTime = 0; soundKnock.play();
            flashlight.intensity = 3.5;
            showSubtitle("Фонарик у меня! Ищи трехзначный красный код на стенах комнаты.");
        }
    }

    function closeLaptopUI() {
        laptopScreen.style.display = 'none';
        renderer.domElement.requestPointerLock();
        game.state = 'playing';
    }

    submitPassword.addEventListener('click', () => {
        if (passwordInput.value === game.correctCode) {
            laptopScreen.style.display = 'none'; game.state = 'win';
            laptopDisplay.material.color.setHex(0x00ff00);
            setTimeout(() => { window.location.href = 'two.html'; }, 2000);
        } else {
            loginError.style.display = 'block';
            setTimeout(() => loginError.style.display = 'none', 1500);
            if (!game.flashlightSpawned) {
                laptopScreen.style.display = 'none'; renderer.domElement.requestPointerLock();
                game.state = 'playing'; game.flashlightSpawned = true; flashlightGroup.visible = true;
                laptopDisplay.material.color.setHex(0x550000);
                showSubtitle("Неверный код доступа. Терминал заблокирован. Возьми со стола фонарик [ E ].");
            }
        }
    });

    // 10. Передвижение и Коллизии
    function updateMovement() {
        if (game.state !== 'playing') return;

        const dir = new THREE.Vector3();
        camera.getWorldDirection(dir);
        dir.y = 0; dir.normalize();

        const sideDir = new THREE.Vector3(-dir.z, 0, dir.x);
        const moveVector = new THREE.Vector3();

        if (moveControls.forward) moveVector.add(dir);
        if (moveControls.backward) moveVector.sub(dir);
        if (moveControls.left) moveVector.sub(sideDir);
        if (moveControls.right) moveVector.add(sideDir);

        moveVector.normalize().multiplyScalar(0.045);
        const nextPos = cameraPivot.position.clone().add(moveVector);

        let allowed = true;

        if (!game.doorOpened) {
            if (cameraPivot.position.z > -5.8 && nextPos.z <= -5.8) {
                allowed = false;
            }
        } else {
            if (cameraPivot.position.z > -5.8 && nextPos.z <= -5.8) {
                if (nextPos.x < -1.3 || nextPos.x > 1.3) allowed = false;
            }
        }

        if (nextPos.z > -5.8) {
            if (nextPos.x < -1.3 || nextPos.x > 1.3 || nextPos.z > -0.2) allowed = false;
        } else {
            if (nextPos.x < -4.7 || nextPos.x > 4.7 || nextPos.z < -15.6) allowed = false;

            // Коллизия стола
            if (nextPos.x > -1.1 && nextPos.x < 1.1 && nextPos.z > -11.7 && nextPos.z < -10.3) {
                allowed = false;
            }
        }

        if (allowed) cameraPivot.position.copy(nextPos);

        if (game.doorOpened && game.doorAngle < Math.PI / 1.7) {
            game.doorAngle += 0.03;
            doorPivot.rotation.y = game.doorAngle;
        }

        flashlight.position.copy(cameraPivot.position).add(new THREE.Vector3(0, -0.15, 0));
        const targetTarget = new THREE.Vector3();
        camera.getWorldDirection(targetTarget);
        flashlight.target.position.copy(cameraPivot.position).add(targetTarget);
    }

    function animate() {
        requestAnimationFrame(animate);
        updateMovement();
        if (game.state === 'playing') checkInteractions();

        if (game.state === 'win') {
            promptEl.style.display = 'block';
            promptEl.innerHTML = "<b style='color:#00ff00; font-size: 22px;'>ДОСТУП ПОЛУЧЕН!</b><br>Загрузка уровня 2...";
        }
        renderer.render(scene, camera);
    }

    window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight; camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
    });

    animate();
</script>
</body>
</html>
